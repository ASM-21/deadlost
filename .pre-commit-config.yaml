# pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      # The repo-specific guard. Prose and results drift apart silently
      # otherwise, and a stale number in the README is the failure mode this
      # project cares most about.
      - id: claims-check
        name: published numbers match results
        entry: python scripts/check_claims.py
        language: system
        pass_filenames: false
        files: '^(README\.md|FINDINGS\.md|results/.*\.json|scripts/check_claims\.py)$'
