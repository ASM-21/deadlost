<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="chess-lab: falsifiable chess research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12212f"/>
      <stop offset="100%" stop-color="#1f4e79"/>
    </linearGradient>
    <pattern id="board" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffffff" opacity="0.030"/>
      <rect x="40" y="40" width="40" height="40" fill="#ffffff" opacity="0.030"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#board)"/>
  <rect x="0" y="0" width="6" height="320" fill="#c0504d"/>
  <text x="72" y="128" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="#ffffff" letter-spacing="-1">chess-lab</text>
  <text x="76" y="176" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#9ec5e8">Falsifiable chess research against 190,967 public games.</text>
  <text x="76" y="214" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#9ec5e8">Nine claims. Checked against the literature, then attacked.</text>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#cfe3f5">
    <rect x="76" y="244" width="196" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="96" y="266">6 claims retracted</text>
    <rect x="288" y="244" width="232" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="308" y="266">literature-checked</text>
    <rect x="536" y="244" width="212" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="556" y="266">every null bounded</text>
    <rect x="764" y="244" width="188" height="34" rx="17" fill="#ffffff" opacity="0.10"/>
    <text x="784" y="266">122 tests passing</text>
  </g>
  <g opacity="0.5">
    <text x="1064" y="180" font-family="Georgia,serif" font-size="150" fill="#ffffff" opacity="0.14">&#9819;</text>
  </g>
</svg>
