[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslab"
version = "1.1.0"
description = "Nine claims about chess tested on 190,967 public games with Stockfish, positioned against the literature, with a falsification track, specification curves with joint inference, and resolution bounds on every null."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrew Morrissey" }]
keywords = ["chess", "lichess", "twic", "stockfish", "elo", "blunders", "openings",
            "reproducible-research", "falsification", "open-data", "specification-curve"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "chess>=1.11",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/ASM-21/chess-lab"
Findings = "https://github.com/ASM-21/chess-lab/blob/main/FINDINGS.md"
Literature = "https://github.com/ASM-21/chess-lab/blob/main/docs/LITERATURE.md"
Issues = "https://github.com/ASM-21/chess-lab/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
chesslab = "chesslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: requires the full ingested corpus or a chess engine"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # function call in default arg is fine for the tool wrappers here
  "E741",   # `l` is used as a local in the CLI parser setup
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
